<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placements — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="placementsTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">Placements</div>
        <div class="panel-subtitle mb-0" id="placementsCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <input id="placementSearchInput" class="search-input" placeholder="Search student, company…" style="width:220px;">
        <select id="placementStatusFilter" class="form-select btn-erp" style="width:180px;">
          <option value="">All statuses</option>
          <option value="not_placed">Not placed</option><option value="interview_scheduled">Interview scheduled</option>
          <option value="selected">Selected</option><option value="joined">Joined</option>
          <option value="rejected">Rejected</option><option value="dropout">Dropout</option>
        </select>
        <button class="btn btn-erp-primary btn-erp" id="addPlacementBtn"><i class="bi bi-plus-lg"></i> Add placement</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="erp-table">
        <thead><tr><th>Student</th><th>Company</th><th>Role</th><th>Salary</th><th>Date</th><th>Status</th><th class="text-end">Edit</th></tr></thead>
        <tbody id="placementsTableBody"><tr><td colspan="7" class="text-center py-4 text-muted">Loading placements…</td></tr></tbody>
      </table>
    </div>
  </div>
</template>

<div class="modal fade" id="placementModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="placementForm">
        <input type="hidden" id="placementFormId">
        <div class="modal-header"><h5 class="modal-title font-display" id="placementModalTitle">Add placement</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Student *</label><select class="form-select" id="placementStudentSelect" required></select></div>
            <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company_name"></div>
            <div class="col-md-6"><label class="form-label">Job role</label><input class="form-control" name="job_role"></div>
            <div class="col-md-6"><label class="form-label">Salary (₹/month)</label><input type="number" class="form-control" name="salary"></div>
            <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location"></div>
            <div class="col-md-6"><label class="form-label">Interview date</label><input type="date" class="form-control" name="interview_date"></div>
            <div class="col-md-6"><label class="form-label">Joining date</label><input type="date" class="form-control" name="joining_date"></div>
            <div class="col-12">
              <label class="form-label">Status</label>
              <select class="form-select" name="placement_status">
                <option value="not_placed">Not placed</option><option value="interview_scheduled">Interview scheduled</option>
                <option value="selected">Selected</option><option value="joined">Joined</option>
                <option value="rejected">Rejected</option><option value="dropout">Dropout</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-erp-primary btn-erp btn" id="placementSaveBtn">Save placement</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/placements.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "placements", title: "Placements", subtitle: "Track every candidate's job outcome" });
    document.getElementById("contentArea").innerHTML = document.getElementById("placementsTemplate").innerHTML;
    initPlacementsPage();
  })();
</script>
</body>
</html>
