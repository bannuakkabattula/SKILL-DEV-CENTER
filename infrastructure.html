<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="infraTemplate">
  <div class="panel mb-3">
    <label class="form-label">Select center</label>
    <select class="form-select" id="infraCenterSelect" style="max-width:360px;"></select>
  </div>

  <div class="panel d-none" id="infraFormArea">
    <div class="panel-title">Infrastructure strength</div>
    <div class="panel-subtitle">Physical infrastructure recorded for this center</div>
    <form id="infraForm">
      <input type="hidden" id="infraRowId">
      <div class="row g-3">
        <div class="col-md-3"><label class="form-label">Classrooms</label><input type="number" min="0" class="form-control" name="classrooms"></div>
        <div class="col-md-3"><label class="form-label">Labs</label><input type="number" min="0" class="form-control" name="labs"></div>
        <div class="col-md-3"><label class="form-label">Computers (total)</label><input type="number" min="0" class="form-control" name="computers"></div>
        <div class="col-md-3"><label class="form-label">Working computers</label><input type="number" min="0" class="form-control" name="working_computers"></div>
        <div class="col-md-3"><label class="form-label">Non-working computers</label><input type="number" min="0" class="form-control" name="non_working_computers"></div>
        <div class="col-md-3"><label class="form-label">Projectors</label><input type="number" min="0" class="form-control" name="projectors"></div>
        <div class="col-md-3"><label class="form-label">Smart TVs</label><input type="number" min="0" class="form-control" name="smart_tvs"></div>
        <div class="col-md-3"><label class="form-label">Printers</label><input type="number" min="0" class="form-control" name="printers"></div>
        <div class="col-md-3"><label class="form-label">Washrooms</label><input type="number" min="0" class="form-control" name="washrooms"></div>
        <div class="col-md-9"><label class="form-label">Other equipment</label><input class="form-control" name="other_equipment"></div>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-md-3 form-check ms-1"><input class="form-check-input" type="checkbox" name="cctv" id="infraCctv"><label class="form-check-label" for="infraCctv">CCTV</label></div>
        <div class="col-md-3 form-check ms-1"><input class="form-check-input" type="checkbox" name="internet" id="infraInternet"><label class="form-check-label" for="infraInternet">Internet</label></div>
        <div class="col-md-3 form-check ms-1"><input class="form-check-input" type="checkbox" name="power_backup" id="infraPower"><label class="form-check-label" for="infraPower">Power backup</label></div>
        <div class="col-md-3 form-check ms-1"><input class="form-check-input" type="checkbox" name="drinking_water" id="infraWater"><label class="form-check-label" for="infraWater">Drinking water</label></div>
      </div>
      <button type="submit" class="btn btn-erp-primary btn-erp mt-4" id="infraSaveBtn">Save infrastructure</button>
    </form>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/infrastructure.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "infrastructure", title: "Infrastructure", subtitle: "Physical infrastructure, per center" });
    document.getElementById("contentArea").innerHTML = document.getElementById("infraTemplate").innerHTML;
    initInfrastructurePage();
  })();
</script>
</body>
</html>
