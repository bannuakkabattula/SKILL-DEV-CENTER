<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="notifTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div class="panel-title mb-0">Notifications</div>
      <div class="d-flex gap-2">
        <select id="notifFilter" class="form-select btn-erp" style="width:200px;">
          <option value="">All categories</option>
          <option value="document_expiring">Document expiring</option>
          <option value="document_expired">Document expired</option>
          <option value="task_overdue">Task overdue</option>
          <option value="task_pending">Task pending</option>
          <option value="batch_ending">Batch ending</option>
          <option value="general">General</option>
        </select>
        <button class="btn btn-erp" id="markAllReadBtn">Mark all read</button>
        <button class="btn btn-erp-primary btn-erp" id="generateNotifBtn"><i class="bi bi-arrow-repeat"></i> Check for alerts</button>
      </div>
    </div>
    <div id="notifList"><div class="text-center text-muted py-4">Loading notifications…</div></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/notifications.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "notifications", title: "Notifications", subtitle: "Alerts for expiring documents and overdue work" });
    document.getElementById("contentArea").innerHTML = document.getElementById("notifTemplate").innerHTML;
    initNotificationsPage();
  })();
</script>
</body>
</html>
