<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="studentAttendanceTemplate">
  <div class="panel mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label">Center</label><select class="form-select" id="saCenterSelect"></select></div>
      <div class="col-md-4"><label class="form-label">Batch</label><select class="form-select" id="saBatchSelect"><option value="">Select center first…</option></select></div>
      <div class="col-md-2"><label class="form-label">Date</label><input type="date" class="form-control" id="saDateInput"></div>
      <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-erp flex-fill" id="saMarkAllPresentBtn" title="Mark all present"><i class="bi bi-check2-all"></i></button>
        <button class="btn btn-erp-primary btn-erp flex-fill" id="saSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Mark attendance</div>
    <div class="panel-subtitle">Select a center, batch and date above</div>
    <div id="saAttendanceArea"><div class="text-center text-muted py-4">Select a batch to mark attendance.</div></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/student-attendance.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "student-attendance", title: "Student Attendance", subtitle: "Mark and review daily batch attendance" });
    document.getElementById("contentArea").innerHTML = document.getElementById("studentAttendanceTemplate").innerHTML;
    initStudentAttendancePage();
  })();
</script>
</body>
</html>
