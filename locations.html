<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locations — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="locationsTemplate">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="panel-subtitle mb-0">Coordinates and address details come from each center's record. <a href="centers.html">Edit in Centers →</a></div>
  </div>
  <div id="locationsArea"><div class="text-center text-muted py-4">Loading locations…</div></div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/locations.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "locations", title: "Locations", subtitle: "Every center's address and map link" });
    document.getElementById("contentArea").innerHTML = document.getElementById("locationsTemplate").innerHTML;
    initLocationsPage();
  })();
</script>
</body>
</html>
