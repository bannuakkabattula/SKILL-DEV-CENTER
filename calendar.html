<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="calendarTemplate">
  <div class="panel">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-erp btn-sm" id="calPrevBtn"><i class="bi bi-chevron-left"></i></button>
        <div class="panel-title mb-0" id="calMonthLabel" style="min-width:160px;text-align:center;">Loading…</div>
        <button class="btn btn-erp btn-sm" id="calNextBtn"><i class="bi bi-chevron-right"></i></button>
      </div>
      <div class="d-flex gap-2" style="font-size:11.5px;color:var(--gray-500);">
        <span><span class="cal-event cal-event-task" style="padding:2px 8px;">Task</span></span>
        <span><span class="cal-event cal-event-batch" style="padding:2px 8px;">Batch</span></span>
        <span><span class="cal-event cal-event-done" style="padding:2px 8px;">Completed</span></span>
      </div>
    </div>
    <div id="calGrid"></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/calendar.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "calendar", title: "Calendar", subtitle: "Work due dates and batch schedule, in one view" });
    document.getElementById("contentArea").innerHTML = document.getElementById("calendarTemplate").innerHTML;
    initCalendarPage();
  })();
</script>
</body>
</html>
