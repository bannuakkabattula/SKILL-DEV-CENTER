<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="settingsTemplate">
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="panel">
        <div class="panel-title">Your profile</div>
        <div class="panel-subtitle">Visible to other admins in this system</div>
        <form id="profileForm">
          <div class="mb-3"><label class="form-label">Email</label><input class="form-control" id="settingsEmail" disabled></div>
          <div class="mb-3"><label class="form-label">Role</label><input class="form-control" id="settingsRole" disabled style="text-transform:capitalize;"></div>
          <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" id="settingsFullName" required></div>
          <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" id="settingsPhone"></div>
          <button type="submit" class="btn btn-erp-primary btn-erp" id="profileSaveBtn">Save changes</button>
        </form>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="panel">
        <div class="panel-title">Change password</div>
        <div class="panel-subtitle">At least 8 characters</div>
        <form id="passwordForm">
          <div class="mb-3"><label class="form-label">New password</label><input type="password" class="form-control" id="settingsNewPassword" required minlength="8"></div>
          <div class="mb-3"><label class="form-label">Confirm new password</label><input type="password" class="form-control" id="settingsConfirmPassword" required minlength="8"></div>
          <button type="submit" class="btn btn-erp-primary btn-erp" id="passwordSaveBtn">Update password</button>
        </form>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/settings.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "settings", title: "Settings", subtitle: "Your account preferences" });
    document.getElementById("contentArea").innerHTML = document.getElementById("settingsTemplate").innerHTML;
    initSettingsPage();
  })();
</script>
</body>
</html>
