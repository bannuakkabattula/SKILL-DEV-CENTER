<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="studentsTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">All students</div>
        <div class="panel-subtitle mb-0" id="studentsCount">Loading…</div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <input id="studentSearchInput" class="search-input" placeholder="Search name, code, mobile…" style="width:210px;">
        <select id="studentCenterFilter" class="form-select btn-erp" style="width:170px;"></select>
        <select id="studentStatusFilter" class="form-select btn-erp" style="width:170px;">
          <option value="">All statuses</option>
          <option value="enrolled">Enrolled</option><option value="training">Training</option>
          <option value="ojt">OJT</option><option value="assessment_pending">Assessment pending</option>
          <option value="completed">Completed</option><option value="placed">Placed</option>
          <option value="dropped">Dropped</option><option value="absconded">Absconded</option>
        </select>
        <button class="btn btn-erp-primary btn-erp" id="addStudentBtn"><i class="bi bi-plus-lg"></i> Add student</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="erp-table">
        <thead><tr><th>Code</th><th>Student</th><th>Gender</th><th>Center</th><th>Batch</th><th>Course</th><th>Status</th><th class="text-end">Edit</th></tr></thead>
        <tbody id="studentsTableBody"><tr><td colspan="8" class="text-center py-4 text-muted">Loading students…</td></tr></tbody>
      </table>
    </div>
  </div>
</template>

<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="studentForm">
        <input type="hidden" id="studentFormId">
        <div class="modal-header"><h5 class="modal-title font-display" id="studentModalTitle">Add student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Student code *</label><input class="form-control" name="student_code" required></div>
            <div class="col-md-8"><label class="form-label">Candidate name *</label><input class="form-control" name="candidate_name" required></div>
            <div class="col-md-6"><label class="form-label">Parent name</label><input class="form-control" name="parent_name"></div>
            <div class="col-md-3"><label class="form-label">Gender</label><select class="form-select" name="gender"><option value="">—</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></div>
            <div class="col-md-3"><label class="form-label">DOB</label><input type="date" class="form-control" name="dob"></div>
            <div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" name="mobile"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email"></div>
            <div class="col-md-6"><label class="form-label">Qualification</label><input class="form-control" name="qualification"></div>
            <div class="col-md-6"><label class="form-label">Course</label><input class="form-control" name="course_name"></div>
            <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address"></div>
            <div class="col-md-3"><label class="form-label">Village</label><input class="form-control" name="village"></div>
            <div class="col-md-3"><label class="form-label">Mandal</label><input class="form-control" name="mandal"></div>
            <div class="col-md-3"><label class="form-label">District</label><input class="form-control" name="district"></div>
            <div class="col-md-3"><label class="form-label">State</label><input class="form-control" name="state"></div>
            <div class="col-md-4"><label class="form-label">PIN code</label><input class="form-control" name="pincode"></div>
            <div class="col-md-4"><label class="form-label">Center</label><select class="form-select" id="studentCenterSelect"></select></div>
            <div class="col-md-4"><label class="form-label">Batch</label><select class="form-select" id="studentBatchSelect"></select></div>
            <div class="col-md-6"><label class="form-label">Enrollment date</label><input type="date" class="form-control" name="enrollment_date"></div>
            <div class="col-md-6">
              <label class="form-label">Training status</label>
              <select class="form-select" name="training_status">
                <option value="enrolled">Enrolled</option><option value="training">Training</option>
                <option value="ojt">OJT</option><option value="assessment_pending">Assessment pending</option>
                <option value="completed">Completed</option><option value="placed">Placed</option>
                <option value="dropped">Dropped</option><option value="absconded">Absconded</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-erp-primary btn-erp btn" id="studentSaveBtn">Save student</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/students.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "students", title: "Students", subtitle: "Every enrolled candidate, across every center" });
    document.getElementById("contentArea").innerHTML = document.getElementById("studentsTemplate").innerHTML;
    initStudentsPage();
  })();
</script>
</body>
</html>
