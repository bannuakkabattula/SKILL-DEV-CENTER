<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="trainingTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">Training schedule</div>
        <div class="panel-subtitle mb-0" id="trainingCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <select id="trainingBatchFilter" class="form-select btn-erp" style="width:190px;"></select>
        <button class="btn btn-erp-primary btn-erp" id="addTrainingBtn"><i class="bi bi-plus-lg"></i> Schedule session</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="erp-table">
        <thead><tr><th>Date</th><th>Time</th><th>Batch</th><th>Type</th><th>Topic</th><th>Trainer</th><th class="text-end">Edit</th></tr></thead>
        <tbody id="trainingTableBody"><tr><td colspan="7" class="text-center py-4 text-muted">Loading sessions…</td></tr></tbody>
      </table>
    </div>
  </div>
</template>

<div class="modal fade" id="trainingModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="trainingForm">
        <input type="hidden" id="trainingFormId">
        <div class="modal-header"><h5 class="modal-title font-display" id="trainingModalTitle">Schedule session</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Batch *</label><select class="form-select" id="trainingBatchSelect" required></select></div>
            <div class="col-md-6">
              <label class="form-label">Session type</label>
              <select class="form-select" name="session_type">
                <option value="theory">Theory</option><option value="practical">Practical</option>
                <option value="lab">Lab</option><option value="ojt">OJT</option>
                <option value="assessment">Assessment</option><option value="certification">Certification</option>
              </select>
            </div>
            <div class="col-md-6"><label class="form-label">Trainer</label><select class="form-select" id="trainingTrainerSelect"></select></div>
            <div class="col-md-4"><label class="form-label">Date</label><input type="date" class="form-control" name="session_date"></div>
            <div class="col-md-4"><label class="form-label">Start time</label><input type="time" class="form-control" name="start_time"></div>
            <div class="col-md-4"><label class="form-label">End time</label><input type="time" class="form-control" name="end_time"></div>
            <div class="col-md-8"><label class="form-label">Topic</label><input class="form-control" name="topic"></div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select class="form-select" name="status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-erp-primary btn-erp btn" id="trainingSaveBtn">Save session</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/training.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "training", title: "Training", subtitle: "Session schedule for every batch" });
    document.getElementById("contentArea").innerHTML = document.getElementById("trainingTemplate").innerHTML;
    initTrainingPage();
  })();
</script>
</body>
</html>
