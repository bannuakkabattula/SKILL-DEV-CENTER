<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="shellMount"></div>

<template id="tasksTemplate">
  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-2-4" style="flex:1 0 18%;">
      <div class="stat-card"><div class="stat-value" id="taskStatTotal">–</div><div class="stat-label">Total works</div></div>
    </div>
    <div class="col-6" style="flex:1 0 18%;">
      <div class="stat-card"><div class="stat-value" style="color:var(--orange-600);" id="taskStatPending">–</div><div class="stat-label">Pending</div></div>
    </div>
    <div class="col-6" style="flex:1 0 18%;">
      <div class="stat-card"><div class="stat-value" style="color:var(--green-600);" id="taskStatCompleted">–</div><div class="stat-label">Completed</div></div>
    </div>
    <div class="col-6" style="flex:1 0 18%;">
      <div class="stat-card"><div class="stat-value" style="color:var(--red-600);" id="taskStatOverdue">–</div><div class="stat-label">Overdue</div></div>
    </div>
    <div class="col-6" style="flex:1 0 18%;">
      <div class="stat-card"><div class="stat-value" style="color:var(--orange-600);" id="taskStatImportant">–</div><div class="stat-label">Important</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
      <div class="panel-title mb-0">Work management</div>
      <button class="btn btn-erp-primary btn-erp" id="addTaskBtn"><i class="bi bi-plus-lg"></i> Assign new work</button>
    </div>

    <div class="task-tabs">
      <button class="task-tab active" data-task-tab="all"><i class="bi bi-kanban-fill"></i> All works <span class="nav-count">0</span></button>
      <button class="task-tab" data-task-tab="assigned"><i class="bi bi-person-check-fill"></i> By employee</button>
      <button class="task-tab" data-task-tab="pending"><i class="bi bi-hourglass-split"></i> Pending <span class="nav-count">0</span></button>
      <button class="task-tab" data-task-tab="completed"><i class="bi bi-check-circle-fill"></i> Completed <span class="nav-count">0</span></button>
      <button class="task-tab" data-task-tab="important"><i class="bi bi-star-fill"></i> Important <span class="nav-count">0</span></button>
      <button class="task-tab" data-task-tab="overdue"><i class="bi bi-exclamation-triangle-fill"></i> Overdue <span class="nav-count">0</span></button>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <input id="taskSearchInput" class="search-input" placeholder="Search work, employee, center…" style="width:230px;">
      <select id="taskCenterFilter" class="form-select btn-erp" style="width:190px;"></select>
      <select id="taskPriorityFilter" class="form-select btn-erp" style="width:150px;">
        <option value="">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <div id="tasksListArea"><div class="text-center py-4 text-muted">Loading works…</div></div>
  </div>
</template>

<!-- Assign/Edit Work Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="taskForm">
        <input type="hidden" id="taskFormId">
        <div class="modal-header">
          <h5 class="modal-title font-display" id="taskModalTitle">Assign new work</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Work title *</label>
            <input class="form-control" name="task_title" required placeholder="e.g. Submit monthly attendance report">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Center</label>
              <select class="form-select" id="taskCenterSelect"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Assign to employee</label>
              <select class="form-select" id="taskEmployeeSelect"></select>
            </div>
          </div>
          <div class="row g-3 mt-0">
            <div class="col-md-6">
              <label class="form-label">Priority</label>
              <select class="form-select" name="priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Due date</label>
              <input type="date" class="form-control" name="due_date">
            </div>
          </div>
          <div class="row g-3 mt-0">
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" name="category">
                <option>Administrative</option>
                <option>Reports</option>
                <option>Placement</option>
                <option>Mobilization</option>
                <option>Training</option>
                <option>Compliance</option>
                <option>Infrastructure</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option value="pending">Pending</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" name="is_important" id="taskImportantCheck">
            <label class="form-check-label" for="taskImportantCheck"><i class="bi bi-star-fill text-warning"></i> Mark as important</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-erp-primary btn-erp btn" id="taskSaveBtn">Save work</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/tasks.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    renderShell({ activeKey: "tasks", title: "Tasks", subtitle: "Assign and track work across every center" });
    document.getElementById("contentArea").innerHTML = document.getElementById("tasksTemplate").innerHTML;
    initTasksPage();
  })();
</script>
</body>
</html>
