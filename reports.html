<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="shellMount"></div>

<template id="reportsTemplate">
  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="panel h-100">
        <div class="panel-title">Center-wise completion</div>
        <div class="panel-subtitle">% of works completed, by center</div>
        <canvas id="chartCompletion" height="200"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="panel h-100">
        <div class="panel-title">Work status breakdown</div>
        <div class="panel-subtitle">All works, organization-wide</div>
        <canvas id="chartStatus" height="200"></canvas>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="panel h-100">
        <div class="panel-title">Priority distribution</div>
        <div class="panel-subtitle">Works by assigned priority</div>
        <canvas id="chartPriority" height="200"></canvas>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="panel h-100">
        <div class="panel-title">Employee workload (top 10)</div>
        <div class="panel-subtitle">Most works currently assigned</div>
        <canvas id="chartWorkload" height="200"></canvas>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">Summary</div>
    <div class="panel-subtitle">Organization-wide totals</div>
    <div class="row g-3" id="reportsKpiGrid"></div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/reports.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    renderShell({ activeKey: "reports", title: "Reports", subtitle: "Organization-wide performance summary" });
    document.getElementById("contentArea").innerHTML = document.getElementById("reportsTemplate").innerHTML;
    loadReports();
  })();
</script>
</body>
</html>
