<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Center Documents — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="cdTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">Center documents</div>
        <div class="panel-subtitle mb-0" id="cdCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <select id="cdCenterFilter" class="form-select btn-erp" style="width:180px;"></select>
        <select id="cdStatusFilter" class="form-select btn-erp" style="width:150px;">
          <option value="">All statuses</option>
          <option value="valid">Valid</option><option value="expiring_soon">Expiring soon</option>
          <option value="expired">Expired</option><option value="pending">Pending</option>
        </select>
        <button class="btn btn-erp-primary btn-erp" id="addCenterDocBtn"><i class="bi bi-upload"></i> Upload document</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="erp-table">
        <thead><tr><th>Document</th><th>Center</th><th>Expiry</th><th>Status</th><th>File</th><th class="text-end">Edit</th></tr></thead>
        <tbody id="cdTableBody"><tr><td colspan="6" class="text-center py-4 text-muted">Loading documents…</td></tr></tbody>
      </table>
    </div>
  </div>
</template>

<div class="modal fade" id="cdModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="cdForm">
        <input type="hidden" id="cdFormId">
        <div class="modal-header"><h5 class="modal-title font-display" id="cdModalTitle">Upload document</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Center *</label><select class="form-select" id="cdCenterSelect" required></select></div>
            <div class="col-md-6">
              <label class="form-label">Document type</label>
              <select class="form-select" name="document_type">
                <option>Rental Agreement</option><option>Lease Agreement</option><option>Work Order</option>
                <option>Schematic Plan</option><option>Scheme Documents</option><option>Center Approval</option>
                <option>Building Documents</option><option>Fire Safety Certificate</option><option>NOC</option>
                <option>Electricity Documents</option><option>Internet Documents</option><option>Equipment Documents</option>
                <option>Inspection Reports</option><option>Affidavits</option><option>Center Photos</option><option>Other Documents</option>
              </select>
            </div>
            <div class="col-12"><label class="form-label">Document name *</label><input class="form-control" name="document_name" required></div>
            <div class="col-md-6"><label class="form-label">Document number</label><input class="form-control" name="document_number"></div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" name="status"><option value="valid">Valid</option><option value="expiring_soon">Expiring soon</option><option value="expired">Expired</option><option value="pending">Pending</option></select>
            </div>
            <div class="col-md-6"><label class="form-label">Issue date</label><input type="date" class="form-control" name="issue_date"></div>
            <div class="col-md-6"><label class="form-label">Expiry date</label><input type="date" class="form-control" name="expiry_date"></div>
            <div class="col-12"><label class="form-label">Remarks</label><input class="form-control" name="remarks"></div>
            <div class="col-12">
              <label class="form-label">File</label>
              <input type="file" class="form-control" id="cdFileInput">
              <div class="form-text" id="cdExistingFileNote"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-erp-primary btn-erp btn" id="cdSaveBtn">Save document</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/center-documents.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "center-documents", title: "Center Documents", subtitle: "Agreements, certificates and approvals" });
    document.getElementById("contentArea").innerHTML = document.getElementById("cdTemplate").innerHTML;
    initCenterDocumentsPage();
  })();
</script>
</body>
</html>
