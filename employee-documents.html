<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Documents — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shellMount"></div>

<template id="edTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">Employee documents</div>
        <div class="panel-subtitle mb-0" id="edCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <select id="edEmployeeFilter" class="form-select btn-erp" style="width:220px;"></select>
        <button class="btn btn-erp-primary btn-erp" id="addEmployeeDocBtn"><i class="bi bi-upload"></i> Upload document</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="erp-table">
        <thead><tr><th>Document</th><th>Type</th><th>Employee</th><th class="text-end">File</th></tr></thead>
        <tbody id="edTableBody"><tr><td colspan="4" class="text-center py-4 text-muted">Loading documents…</td></tr></tbody>
      </table>
    </div>
  </div>
</template>

<div class="modal fade" id="edModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="edForm">
        <div class="modal-header"><h5 class="modal-title font-display">Upload employee document</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12"><label class="form-label">Employee *</label><select class="form-select" id="edEmployeeSelect" required></select></div>
            <div class="col-12"><label class="form-label">Document name *</label><input class="form-control" name="document_name" required placeholder="e.g. Appointment Letter"></div>
            <div class="col-12">
              <label class="form-label">Document type</label>
              <select class="form-select" name="document_type">
                <option>Qualification Certificate</option><option>Experience Certificate</option>
                <option>Appointment Letter</option><option>Joining Documents</option>
                <option>ID Documents</option><option>Other Official Documents</option>
              </select>
            </div>
            <div class="col-12"><label class="form-label">File *</label><input type="file" class="form-control" id="edFileInput" required></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn-erp-primary btn-erp btn" id="edSaveBtn">Upload</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/employee-documents.js"></script>
<script>
  (async () => {
    const session = await requireSession(); if (!session) return;
    renderShell({ activeKey: "employee-documents", title: "Employee Documents", subtitle: "Certificates, letters and IDs, per employee" });
    document.getElementById("contentArea").innerHTML = document.getElementById("edTemplate").innerHTML;
    initEmployeeDocumentsPage();
  })();
</script>
</body>
</html>
