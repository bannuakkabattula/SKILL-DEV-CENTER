<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centers — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="shellMount"></div>

<template id="centersTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">All centers</div>
        <div class="panel-subtitle mb-0" id="centersCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <input id="centerSearchInput" class="search-input" placeholder="Search name, code, district…" style="width:230px;">
        <select id="centerStatusFilter" class="form-select btn-erp" style="width:170px;">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="under_verification">Under verification</option>
          <option value="temporarily_closed">Temporarily closed</option>
        </select>
        <button class="btn btn-erp-primary btn-erp" id="addCenterBtn"><i class="bi bi-plus-lg"></i> Add center</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="erp-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Center</th>
            <th>Incharge</th>
            <th>Students</th>
            <th>Employees</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="centersTableBody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading centers…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</template>

<!-- Add/Edit Center Modal -->
<div class="modal fade" id="centerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="centerForm">
        <input type="hidden" id="centerFormId">
        <div class="modal-header">
          <h5 class="modal-title font-display" id="centerModalTitle">Add center</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Center code *</label>
              <input class="form-control" name="center_code" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Center name *</label>
              <input class="form-control" name="center_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Center type</label>
              <input class="form-control" name="center_type" placeholder="e.g. PMKVY Center">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="under_verification">Under verification</option>
                <option value="temporarily_closed">Temporarily closed</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input class="form-control" name="address">
            </div>
            <div class="col-md-4">
              <label class="form-label">Village</label>
              <input class="form-control" name="village">
            </div>
            <div class="col-md-4">
              <label class="form-label">Mandal</label>
              <input class="form-control" name="mandal">
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input class="form-control" name="city">
            </div>
            <div class="col-md-4">
              <label class="form-label">District</label>
              <input class="form-control" name="district">
            </div>
            <div class="col-md-4">
              <label class="form-label">State</label>
              <input class="form-control" name="state">
            </div>
            <div class="col-md-4">
              <label class="form-label">PIN code</label>
              <input class="form-control" name="pincode">
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact number</label>
              <input class="form-control" name="contact_number">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Center incharge</label>
              <input class="form-control" name="center_incharge">
            </div>
            <div class="col-md-6">
              <label class="form-label">Center coordinator</label>
              <input class="form-control" name="center_coordinator">
            </div>
            <div class="col-md-6">
              <label class="form-label">Establishment date</label>
              <input type="date" class="form-control" name="establishment_date">
            </div>
            <div class="col-md-3">
              <label class="form-label">Latitude</label>
              <input class="form-control" name="latitude" placeholder="16.9891">
            </div>
            <div class="col-md-3">
              <label class="form-label">Longitude</label>
              <input class="form-control" name="longitude" placeholder="82.2475">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-erp-primary btn-erp btn" id="centerSaveBtn">Save center</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/centers.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    renderShell({ activeKey: "centers", title: "Centers", subtitle: "Manage every skill development center" });
    document.getElementById("contentArea").innerHTML = document.getElementById("centersTemplate").innerHTML;
    initCentersPage();
  })();
</script>
</body>
</html>
