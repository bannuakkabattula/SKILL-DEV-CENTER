<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees — Skill Development Center ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="shellMount"></div>

<template id="employeesTemplate">
  <div class="panel">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <div>
        <div class="panel-title mb-0">Employees</div>
        <div class="panel-subtitle mb-0" id="employeesCount">Loading…</div>
      </div>
      <div class="d-flex gap-2">
        <input id="employeeSearchInput" class="search-input" placeholder="Search name, code, role…" style="width:230px;">
        <button class="btn btn-erp-primary btn-erp" id="addEmployeeBtn"><i class="bi bi-plus-lg"></i> Add employee</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="erp-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Employee</th>
            <th>Designation</th>
            <th>Center</th>
            <th>Status</th>
            <th>Today's attendance</th>
            <th class="text-end">Edit</th>
          </tr>
        </thead>
        <tbody id="employeesTableBody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading employees…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</template>

<!-- Add/Edit Employee Modal -->
<div class="modal fade" id="employeeModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="employeeForm">
        <input type="hidden" id="employeeFormId">
        <div class="modal-header">
          <h5 class="modal-title font-display" id="employeeModalTitle">Add employee</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Employee code *</label>
              <input class="form-control" name="employee_code" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Full name *</label>
              <input class="form-control" name="full_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Designation *</label>
              <select class="form-select" name="designation" required>
                <option value="">Select…</option>
                <option>Center Incharge</option>
                <option>Project Manager</option>
                <option>Center Coordinator</option>
                <option>Trainer</option>
                <option>Mobilizer</option>
                <option>Counsellor</option>
                <option>Placement Officer</option>
                <option>MIS Executive</option>
                <option>Accountant</option>
                <option>Office Assistant</option>
                <option>Support Staff</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Department</label>
              <input class="form-control" name="department">
            </div>
            <div class="col-md-6">
              <label class="form-label">Center</label>
              <select class="form-select" id="employeeCenterSelect"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Employee type</label>
              <select class="form-select" name="employee_type">
                <option value="full_time">Full time</option>
                <option value="part_time">Part time</option>
                <option value="contract">Contract</option>
                <option value="intern">Intern</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Mobile</label>
              <input class="form-control" name="mobile">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Qualification</label>
              <input class="form-control" name="qualification">
            </div>
            <div class="col-md-6">
              <label class="form-label">Experience (years)</label>
              <input type="number" step="0.5" class="form-control" name="experience_years">
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of joining</label>
              <input type="date" class="form-control" name="date_of_joining">
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="on_leave">On leave</option>
                <option value="terminated">Terminated</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-erp btn" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-erp-primary btn-erp btn" id="employeeSaveBtn">Save employee</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/employees.js"></script>
<script>
  (async () => {
    const session = await requireSession();
    if (!session) return;
    renderShell({ activeKey: "employees", title: "Employees", subtitle: "Staff records and daily attendance" });
    document.getElementById("contentArea").innerHTML = document.getElementById("employeesTemplate").innerHTML;
    initEmployeesPage();
  })();
</script>
</body>
</html>
